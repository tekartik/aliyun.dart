  tekartik_js_utils:
    git:
      url: https://github.com/tekartik/js_utils.dart
      path: js_utils
dev_dependencies:
  dev_build: ">=1.1.7+3"

  test: ">=1.31.0"
  # needed node dev dependencies
  build_runner: ">=2.15.0"
  build_web_compilers: ">=4.4.19"
  tekartik_build_node:
    git:
      url: https://github.com/tekartik/build_node.dart
