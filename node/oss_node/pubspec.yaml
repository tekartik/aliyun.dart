name: tekartik_aliyun_oss_node
description: Aliyun oss node access
version: 0.3.1
publish_to: none
# homepage: https://www.example.com

environment:
  sdk: ^3.11.0

dependencies:
  path: ">=1.9.1"
  tekartik_aliyun_oss:
    git:
      url: https://github.com/tekartik/aliyun.dart
      path: common/oss
    version: '>=0.2.0'
  collection: ">=1.19.1"
  tekartik_app_node_utils:
    git:
      url: https://github.com/tekartik/app_node_utils.dart
      path: node_utils
    version: '>=0.1.0'
  node_interop:
  js:
  tekartik_js_utils:
    git:
      url: https://github.com/tekartik/js_utils.dart
      path: js_utils
dev_dependencies:
  dev_build: ">=1.1.7+3"

  test: ">=1.31.0"
  # needed node dependencies
  build_runner: ">=2.15.0"
  build_web_compilers: ">=4.4.19"
  tekartik_build_node:
    git:
      url: https://github.com/tekartik/build_node.dart
      path: packages/build_node

resolution: workspace
